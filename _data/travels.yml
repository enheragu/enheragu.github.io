# Travel map (/travel/): where research has taken me, and where it reached.
#
# modes:  the two hero switches (can be combined). "been" = events I attended;
#         "away" = events where my work was presented without me
#         (`attended: false`). Colour never encodes this: places reached only
#         without me get a diamond pin instead of a disc.
# filters: category chips (also the legend). `color` is a theme token used by
#         pins, arcs, dots and tags of that category, in both modes.
# places: every pin on the globe. `home` marks where I lived & worked: each
#         trip departs from the home of its date (arcs + km); home pins carry a
#         house mark and are always visible.
# events: one entry per trip/event, newest first.
#         kind: conference | stay | fieldtest
#         from/to: "YYYY", "YYYY-MM" or "YYYY-MM-DD" (`to` only for ranges).
#         attended: false -> presented there without me ("away" mode).
#         trip:    shared id when one journey visits several places, in date
#                  order (arcs chain home -> stop -> stop; km counted once).
#         online:  held/attended remotely -> no arc, no km.
#         cvn:     (conferences) CVN-only data shared by all the works of the
#                  event: organizer, scope, proceedings (ISBN/ISSN), source.
#         Links reuse existing data by id, nothing is duplicated:
#           pubs:    keys of publications.yml (generated from publications.bib)
#           gallery: campaign id in galleries.yml  -> photos + "Photos" link
#           cv:      panel id in cv_sections.yml   -> "In the CV" link
#           project: panel id in projects.yml      -> "Project" link
#           links:   external pages [{label, url}]
#         Research stays (kind: stay) are also the single source of the stays
#         listed in the CV Work panel (compact) and the /academic/ PhD panel
#         (full), via _includes/stay_list.html:
#           host:        who hosted me            -> globe card + /academic/
#           topic:       "Hosted by <host>, on <topic>." -> globe card + /academic/
#           institution: full name, own sentence -> /academic/
#           work:        what I did, own sentence -> /academic/
#           certified:   {from, to} certified stay period, only when it differs
#                        from the travel dates (e.g. arrival the day before);
#                        shown in the CV and used by the CVN
#           grant:       funding of the stay (or of a conference trip: CVN only).
#                        desc -> "Funded by a <desc> (<name>)." in /academic/
#                        (stays); the rest is the CVN "Ayudas y becas" item:
#                        name (official), entity (that grants it), purpose,
#                        granted (definitive resolution date), end (amount: local cvn_local.yml),
#                        listed, source (call + resolution). null = to fill in.
#           cvn:         CVN-only fields of the stay (/cvn/ page): entity,
#                        entity_type, centre, objective (Objetivos de la
#                        estancia), tasks (Tareas contrastables), type (Tipo
#                        Estancia), listed (date of the CVN that already
#                        includes it; absent = new). null = still to fill in.

modes:
- id: been
  label: "Research has taken me"
  attended: true
- id: away
  label: "Research went without me"
  attended: false

