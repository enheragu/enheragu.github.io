# Teaching record — one entry per course·year, newest first. Single source for:
#   - /academic/ Teaching panel (_academic/detail_teaching.html): full list.
#   - CV Work panel (_cv_sections/detail_umh.html): one summary line per role.
#   - PDF Teaching section (_cv_sections/detail_teaching.html): table + total ECTS.
#   - CVN page (cvn.md, /cvn/): "Formación académica impartida".
# Fields: role (chip + summary group), course, programme, year, ects.
#   type:   kind of teaching (e.g. "lab sessions"); the PDF says it once if all
#           entries share it.
#   job:    key of _data/employment.yml when the entry comes with its own
#           contract (e.g. the lectureship): its period is shown instead of the
#           academic years in the summary (_includes/teaching_period.html).
#   note:   optional extra line under the entry in /academic/ (HTML allowed).
#   cvn:    CVN-only fields (never rendered on the web/PDF), values as the FECYT
#           editor expects them (Spanish). null = still to fill in.
#             course / degree: official names · programme_type: Tipo de programa
#             subject_type: Obligatoria/Optativa/Troncal… · teaching_type: Tipo de
#             docencia · course_year: Curso que se imparte · start/end: ISO dates
#             centre / department / language: Facultad, Departamento, Idioma
#             listed: date of the CVN that already includes it (absent = new)
#             code: UMH subject code · source: official page backing the data
#             open questions: local _data/cvn_local.yml, key "teaching:<code>/<year>"
# Only TAUGHT courses go here: assigned-but-not-yet-taught ones stay commented
# out until the term ends (they would inflate the ECTS total).
# To grow it, just add an entry here; it reuses the publication list/chip styles.

