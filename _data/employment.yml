# Single source of truth for every job/contract. Consumed by:
#   _includes/job_label.html -> "[dates] · role · org" label for index.md,
#                               print.md and the canvas (window.cvLabels); items
#                               in cv_sections.yml carry `job: <key>` (same
#                               pattern as `edu:` -> education.yml)
#   cvn.md (/cvn/)           -> CVN "Situación profesional actual" (ongoing)
#                               and "Cargos y actividades desempeñados con anterioridad"
#   teaching.yml (`job:`)    -> contract period of a teaching entry
# Fields: role, org (display), start/end ("YYYY-MM" or "YYYY-MM-DD"; the shown
#   dates are derived from them by _includes/date_span.html), ongoing: true.
#   A job made of several contracts lists them in cvn.contracts (category, start,
#   end, funding, dedication, department, ongoing); its start is the first contract's.
#   A contract's department overrides the job's cvn.department.
#   Resolution references (they name people) live in the local cvn_local.yml `sources:`.
# cvn: CVN-only fields, as the FECYT editor expects them: entity, entity_type,
#   department, category (Categoría profesional), listed (date of the CVN that
#   already includes it; absent = new). null = still to fill in.
#   `cvn: false` = not listed in the CVN. `cvn.local_only: true` = CVN item shown
#   only on the local /cvn/ (never on the published page or in its PDF).
# Private fields (e.g. contract type) and open questions are NOT stored here
# (this repo is public): they live in the local, git-ignored _data/cvn_local.yml.
# Entries without a cv_sections item (umh_lecturer) only feed the CVN and teaching.yml.
umh_phd:
  role: "Research Engineer & PhD Student"
  org: "UMH"
  ongoing: true                 # the web label starts at the first contract below
  cvn:
    entity: "Universidad Miguel Hernández de Elche"
    entity_type: "Universidad"
    department: "Grupo de Automatización y Robótica, Instituto de Investigación en Ingeniería de Elche"
    # One CVN item per contract, oldest first (BOUMH resolutions, referenced in
    # the local _data/cvn_local.yml). Start/end dates = alta/baja in the Social
    # Security work-history report (vida laboral, 19/11/2026); extensions are not
    # published in the BOUMH. The ongoing one is the CVN «Situación profesional
    # actual»; the others go to «Cargos … anterioridad».
    contracts:
    - category: "Investigador/a en formación (contrato predoctoral)"
      start: "2022-12-01"
      end: "2024-12-31"
      funding: "PROMETEO/2021/075"
    - category: "Titulado Superior I"
      start: "2025-01-01"
      end: "2025-02-28"
      funding: "PID2020-116418RB-I00 (HyReBot)"
    - category: "Titulado Superior I"
      start: "2025-03-01"
      end: "2025-06-30"
      funding: "TED2021-130901B-I00"
    - category: "Titulado Superior I"
      start: "2025-07-01"
      end: "2025-10-15"
      funding: "INNVA1/2023/61 (AViRobots)"
    - category: "Titulado Superior I"
      start: "2025-10-16"
      ongoing: true
      funding: "PID2023-149575OB-I00 (Robot_Vigilante)"
umh_lecturer:
  role: "Substitute Lecturer"
  org: "UMH"
  start: "2026-03-03"           # alta/baja in the vida laboral (19/11/2026)
  end: "2026-07-05"
  cvn:
    local_only: true            # public CV: only the teaching (Enrique); the CVN item shows locally only
    entity: "Universidad Miguel Hernández de Elche"
    entity_type: "Universidad"
umh_intern:
  role: "Research Intern"
  org: "UMH"
  start: "2022-02"              # approximate dates (Enrique)
  end: "2022-09"
  cvn: false                    # not listed in the CVN (Enrique, 2026-11-19)
gmv:
