  print_compact: true
- id: detail-gmv
  job: gmv
  print_page: 1
- id: detail-bq
  job: bq
  print_page: 1
  print_compact: true
# PDF-only full teaching record (subjects, years, ECTS, total), first thing on
# page 2: the Work bullet on page 1 summarises it and links here. On the web the
