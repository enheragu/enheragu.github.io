content_path: _cv_sections

# `group` starts a new top-level section. `label` names each entry (education
# entries use `edu:` -> _data/education.yml and jobs `job:` -> _data/employment.yml
# instead, see index.md/academic.md/print.md).
#
# PRINT-ONLY flags (ignored by the web index/academic pages):
#   print_page: 1|2|3  -> which PDF page-group the entry renders on.
#                         1 = compact core (About/Education/Experience/Skills),
#                         2 = Teaching + Publications + Awards, 3 = Projects + Courses.
#   print_compact: true -> in the PDF, render only the one-line heading (no panel
#                          body) — used to summarise secondary work roles.
#   print_only: true    -> PDF-only entry: the web index skips it (its content is
#                          already on the web elsewhere, e.g. Teaching in /academic/).
items:
- id: detail-presentation
  group: "About me"
  print_page: 1
- id: detail-phd
  group: "Education"
  edu: phd
  print_page: 1
- id: detail-mscrobotics
  edu: msc
  print_page: 1
- id: detail-electronicsdeg
  edu: bsc
  print_page: 1
- id: detail-umh
  group: "Work Experience"
  job: umh_phd
  print_page: 1
# Folded into detail-umh (2026-11-18): the research stays and the lectureship
# belong to the PhD period, so they are summarised in that panel (teaching from
# _data/teaching.yml, stays from the stay events of _data/travels.yml) and
# detailed in /academic/. Their old panels stay in _cv_sections/ for reference.
