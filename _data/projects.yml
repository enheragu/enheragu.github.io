content_path: _projects

# Single source of truth for every project entry.
#   name + from/to/ongoing  -> derived "[dates] · name" label (date_span.html, plain months), used by:
#                                * projects.md   -> visually-hidden heading (a11y / Ctrl+F) + window.cvLabels
#                                * js/projects.js -> canvas commit text (via cvLabels; JS fallback is name-only)
#   name + dates + title/desc/link -> _cv_sections/detail_projects.html (CV summary list, grouped by `group`)
#   panel: false            -> summary-only entry (no /projects/ graph node nor _projects/*.html panel)
#   title / code            -> official title and funder's reference: CV summary,
#                              first line of the _projects/*.html panel, /cvn/ page
#   from/to/ongoing         -> MY period in the project ("YYYY" or "YYYY-MM"):
#                              shown on the web, and on /cvn/ as the narrative of my
#                              contribution; the project's official dates are cvn.start/end
#   cvn:                    -> CVN-only data with its source (/cvn/ page): funder,
#                              programme, entity, city, pi, researchers,
#                              participation, contribution, start/end, amount,
#                              source, listed (date of the CVN that already
#                              has it); open questions: local _data/cvn_local.yml
# The rest of the rich /projects/ panels lives in _projects/*.html.

