# Single source of truth for every project entry.
#   name + dates            -> derived "[dates] · name" label, used by:
#                                * projects.md   -> visually-hidden heading (a11y / Ctrl+F) + window.cvLabels
#                                * js/projects.js -> canvas commit text (via cvLabels; JS fallback is name-only)
#   name + dates + desc/link -> _cv_sections/detail_projects.html (CV summary list, grouped by `group`)
#   panel: false            -> summary-only entry (no /projects/ graph node nor _projects/*.html panel)
# The rich /projects/ panels live in _projects/*.html and are NOT generated from this file.

